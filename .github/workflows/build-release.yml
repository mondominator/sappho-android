name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  # Manual run on main rebuilds and redeploys to Play internal; it no longer
  # creates a GitHub Release or a date tag.
  workflow_dispatch:

# Restrict permissions at workflow level
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Pin actions to SHA for security
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Upload Test Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: test-results
        path: app/build/test-results/
        retention-days: 14

    - name: Run Lint
      run: ./gradlew lint

    - name: Upload Lint Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
        retention-days: 14

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Only build signed releases for trusted contexts (not fork PRs)
    - name: Check if secrets are available
      id: secrets-check
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: Decode Keystore
      if: steps.secrets-check.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

    - name: Build Signed Release APK
      if: steps.secrets-check.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Build Signed Release AAB
      if: steps.secrets-check.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease

    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: sappho-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK artifact
      if: steps.secrets-check.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: sappho-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Upload Release AAB artifact
      if: steps.secrets-check.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: sappho-release-aab
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 30

    # Clean up keystore file
    - name: Clean up keystore
      if: always()
      run: rm -f ${{ github.workspace }}/release.keystore

  # Play internal track. Runs only after `build` (tests, lint, signed AAB)
  # succeeded for this exact commit, so a red build can never ship.
  deploy-play:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: play-deploy
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Download Release AAB
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: sappho-release-aab
        path: app/build/outputs/bundle/release

    - name: Install Ruby and Fastlane
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev build-essential
        sudo gem install fastlane

    - name: Decode Play Store Key
      env:
        PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      run: |
        echo "$PLAY_STORE_JSON_KEY" | base64 --decode > play-store-key.json

    - name: Deploy to Internal Testing
      env:
        PLAY_STORE_JSON_KEY_PATH: ${{ github.workspace }}/play-store-key.json
      run: fastlane internal

    - name: Cleanup secrets
      if: always()
      run: rm -f play-store-key.json

  # GitHub Release, only for a pushed vX.Y.Z tag that matches versionName.
  # (Manual dispatch runs no longer mint date-stamped tags.)
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Check tag matches versionName
      run: |
        VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
        if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME} (expected v${VERSION_NAME})"
          exit 1
        fi

    - name: Download Debug APK
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: sappho-debug-apk
        path: ./apk/debug

    - name: Download Release APK
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: sappho-release-apk
        path: ./apk/release

    - name: Download Release AAB
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: sappho-release-aab
        path: ./aab/release

    - name: Rename artifacts
      run: |
        TAG="${GITHUB_REF_NAME}"
        mv ./apk/debug/*.apk ./apk/sappho-debug-${TAG}.apk
        mv ./apk/release/*.apk ./apk/sappho-release-${TAG}.apk
        mv ./aab/release/*.aab ./aab/sappho-release-${TAG}.aab

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          ./apk/sappho-debug-*.apk
          ./apk/sappho-release-*.apk
          ./aab/sappho-release-*.aab
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
